[project]
name = "mcp-stem-splitter"
version = "0.1.0"
description = "MCP server for stem splitting (drums/bass/vocals/other) using headless separation."
requires-python = ">=3.11"
dependencies = [
  # <2 is a real bound, not tidiness: mcp 2.x renamed FastMCP to MCPServer and changed the
  # decorator/run API, so "mcp>=1.0.0" alone installs a version this server cannot even
  # import (measured: pip resolves 2.3.0 and "from mcp.server.fastmcp import FastMCP" raises).
  "mcp>=1.0.0,<2",
  "demucs>=4.0.0",
  "soundfile>=0.12.1",
  "torch",
  "librosa",
  "pretty_midi",
  "numpy",
]

[project.scripts]
mcp-stem-splitter = "mcp_stem_splitter.__main__:main"

[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]

# the drum-transcription model ships with the package so a fresh install needs no
# network and no path to anyone's checkout (see mcp_stem_splitter/adt_of.py)
[tool.setuptools.package-data]
"mcp_stem_splitter.vendor.adtof_pytorch" = ["data/*.pth", "NOTICE.md"]
